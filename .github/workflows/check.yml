name: Check

on:
  pull_request:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Package
        run: npm run build

      - name: Run Tests
        run: npm test
